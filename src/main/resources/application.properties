spring.application.name=cloudstorage

spring.datasource.url=jdbc:postgresql://localhost:5432/cloudstorage
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=512MB

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.session.timeout=30m
spring.session.redis.namespace=cloudstorage:session

minio.endpoint=http://localhost:9000
minio.access-key=user
minio.secret-key=password
minio.bucket=user-files

rate-limit.auth.max-requests=10
rate-limit.auth.window-seconds=60